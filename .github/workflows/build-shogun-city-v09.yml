name: KAGEBOUND Build Shogun City v09
on:
  push:
    branches: [main]
    paths:
      - 'scripts/build_shogun_city_v09.py'
      - '.github/workflows/build-shogun-city-v09.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: kagebound-shogun-v09
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install trimesh==4.9.0 numpy==2.2.6 Pillow==11.3.0
      - name: Generate GLBs, OBJs, textures and manifests
        run: python scripts/build_shogun_city_v09.py
      - name: Validate mesh exports and LODs
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, trimesh
          from PIL import Image
          root=Path('assets/world/shogun_last_city/v09')
          manifest=json.loads((root/'manifest.json').read_text())['assets']
          assert len(manifest)==8
          for name,item in manifest.items():
              assert (root/item['source']).stat().st_size>100
              tris=[]
              for lod in ('lod0','lod1'):
                  path=root/item['lods'][lod]['file']
                  scene=trimesh.load(root/path,force='scene')
                  assert len(scene.geometry)>0, path
                  count=sum(len(mesh.faces) for mesh in scene.geometry.values())
                  assert count==item['lods'][lod]['triangles'] and count>0
                  tris.append(count)
              assert tris[1]<=tris[0], (name,tris)
          assert len(list(root.glob('*_albedo.png')))==9
          for file in root.glob('*_albedo.png'):
              with Image.open(file) as im:
                  assert im.size==(256,256)
                  im.verify()
          print('PASS: eight world assets, 16 GLBs, eight OBJ sources, nine albedo maps')
          PY
      - name: Commit generated binaries
        run: |
          git config user.name "kagebound-asset-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/world/shogun_last_city/v09
          if ! git diff --cached --quiet; then
            git commit -m "assets(world): export eight Shogun City textured meshes and LODs"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
