name: KAGEBOUND Build World Art v08
on:
  push:
    branches: [main]
    paths:
      - 'scripts/build_world_kit_v08.py'
      - '.github/workflows/build-world-kit-v08.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: kagebound-world-v08
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install trimesh==4.9.0 numpy==2.2.6 Pillow==11.3.0
      - name: Generate real textured GLB and OBJ assets
        run: python scripts/build_world_kit_v08.py
      - name: Validate exported geometry and textures
        run: |
          python - <<'PY'
          import json, trimesh
          from pathlib import Path
          p=Path("assets/world/dojo_moonfall/v08")
          manifest=json.loads((p/"manifest.json").read_text())["assets"]
          assert len(manifest)==8
          for name,item in manifest.items():
              assert (p/item["source"]).stat().st_size>100
              counts=[]
              for lod in ("lod0","lod1"):
                  path=p/item["lods"][lod]["file"]
                  scene=trimesh.load(path,force="scene")
                  count=sum(len(g.faces) for g in scene.geometry.values())
                  assert count>0 and count==item["lods"][lod]["triangles"]
                  counts.append(count)
              assert counts[0]>=counts[1],(name,counts)
          assert len(list(p.glob("*_albedo.png")))==9
          print("Validated eight GLB pairs, eight OBJ sources and nine albedo textures")
          PY
      - name: Commit binary assets
        run: |
          git config user.name "kagebound-asset-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/world/dojo_moonfall/v08
          if ! git diff --cached --quiet; then
            git commit -m "assets(world): export eight original textured v08 world meshes"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
