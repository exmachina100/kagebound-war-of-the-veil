name: Publish KAGEBOUND UI to Roblox
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests==2.32.5 Pillow==11.3.0
      - name: Check imported atlas and sprites
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          root=Path("assets/ui/icons/v01")
          assert (root/"atlas.png").exists(), "Run Import OpenArt UI atlas workflow first"
          icons=list(root.glob("*.png"))
          assert len(icons)>=17, "Missing generated icons"
          for file in icons:
              with Image.open(file) as img:
                  img.verify()
          print("Validated",len(icons),"PNG files")
          PY
      - name: Upload PNGs to Roblox Open Cloud
        env:
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
          ROBLOX_CREATOR_USER_ID: '1559243747'
        run: python scripts/upload_ui_to_roblox.py
      - name: Build Luau asset registry
        run: python scripts/build_ui_registry.py
      - name: Commit verified asset IDs and runtime registry
        run: |
          git config user.name "kagebound-ui-asset-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/ui/icons/v01/roblox_asset_ids.json src/shared/UIIconRegistry.lua
          if ! git diff --cached --quiet; then
            git commit -m "assets(ui): register verified Roblox icon asset IDs"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
