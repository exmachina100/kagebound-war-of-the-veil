name: KAGEBOUND Runtime Asset Sync
on:
  push:
    branches: [main]
    paths:
      - 'assets/**'
      - 'scripts/build_asset_catalog.py'
      - 'scripts/publish_runtime_assets.py'
      - 'scripts/build_runtime_registry.py'
      - '.github/workflows/runtime-asset-sync.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: kagebound-runtime-assets
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests==2.32.5 Pillow==11.3.0
      - name: Index existing and new assets
        run: python scripts/build_asset_catalog.py
      - name: Validate PNG runtime assets
        run: |
          python - <<'PY'
          import json
          from PIL import Image
          catalog=json.load(open('assets/asset_catalog.json'))
          for item in catalog['assets']:
              if item['robloxUploadEligible']:
                  with Image.open(item['path']) as im:
                      im.verify()
          print('Validated runtime PNG assets')
          PY
      - name: Upload eligible PNG assets to personal Roblox account
        env:
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
          ROBLOX_CREATOR_USER_ID: '1559243747'
        run: python scripts/publish_runtime_assets.py
      - name: Generate Roblox Luau asset registry
        run: python scripts/build_runtime_registry.py
      - name: Commit catalog and verified Roblox IDs
        run: |
          git config user.name "kagebound-asset-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/asset_catalog.json assets/roblox_runtime_assets.json src/shared/RuntimeAssetRegistry.lua
          if ! git diff --cached --quiet; then
            git commit -m "assets: sync Roblox runtime asset registry [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
