name: Import OpenArt KAGEBOUND UI atlas
on:
  push:
    branches: [main]
    paths:
      - scripts/import_openart_ui.py
      - .github/workflows/import-openart-ui.yml
  workflow_dispatch:
    inputs:
      image_url:
        description: OpenArt generated PNG URL
        required: true
        default: https://cdn.openart.ai/openart-ai/production/2026-11/create-image/zJfldFkAyO87iqeQBjIU/021794388261809681426abb3fc8758bc9af65311c7ae316516d2_1794388300738_539e970c.png
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow==11.3.0 requests==2.32.5
      - name: Download and validate generated PNG, split sprites
        env:
          OPENART_IMAGE_URL: ${{ inputs.image_url || 'https://cdn.openart.ai/openart-ai/production/2026-11/create-image/zJfldFkAyO87iqeQBjIU/021794388261809681426abb3fc8758bc9af65311c7ae316516d2_1794388300738_539e970c.png' }}
        run: python scripts/import_openart_ui.py
      - name: Commit imported art to main
        run: |
          git config user.name "kagebound-ui-asset-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/ui/icons/v01/
          if ! git diff --cached --quiet; then
            git commit -m "assets(ui): import approved OpenArt UI icon atlas"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
