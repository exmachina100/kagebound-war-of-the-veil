name: KAGEBOUND Generate Skybox Faces
on:
  push:
    branches: [main]
    paths:
      - 'scripts/generate_sky_cubemaps.py'
      - 'scripts/validate_sky_cubemap_seams.py'
      - '.github/workflows/generate-sky-cubemaps.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: kagebound-skybox-generation
  cancel-in-progress: false
jobs:
  sky:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.2.6 Pillow==11.3.0
      - name: Generate sky-only PNG faces
        run: python scripts/generate_sky_cubemaps.py
      - name: Validate faces
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          for variant in ("moonfall", "veilfall"):
              p=Path("assets/ui/skybox")/variant/"v01"
              files=sorted(p.glob("*.png"))
              assert {f.stem for f in files}=={"Bk","Dn","Ft","Lf","Rt","Up"}
              for f in files:
                  with Image.open(f) as im:
                      assert im.size==(512,512) and im.mode=="RGB"
                      im.verify()
          print("12 square skybox faces verified")
          PY
      - name: Verify cubemap orientation and 12 edge seams
        run: python scripts/validate_sky_cubemap_seams.py
      - name: Commit production sky faces
        run: |
          git config user.name "kagebound-asset-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/ui/skybox/moonfall/v01 assets/ui/skybox/veilfall/v01
          if ! git diff --cached --quiet; then
            git commit -m "assets(sky): publish generated moonfall and veilfall faces"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
