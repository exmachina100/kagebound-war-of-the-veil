name: KAGEBOUND Yomi Rift v11 Mesh Production
on:
  push:
    branches: [main]
    paths:
      - 'scripts/generate_yomi_rift_v11.py'
      - '.github/workflows/yomi-rift-v11.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: yomi-rift-v11-assets
  cancel-in-progress: false
jobs:
  produce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy==2.2.6' 'Pillow==11.3.0' 'trimesh==4.8.3'
      - name: Generate actual geometry and textures
        run: python scripts/generate_yomi_rift_v11.py
      - name: Validate eight meshes and 16 LOD binaries
        run: |
          python - <<'PY'
          import json, trimesh
          from pathlib import Path
          p=Path('assets/world/yomi_rift/v11')
          manifest=json.loads((p/'manifest.json').read_text())
          assert len(manifest['assets'])==8
          assert len(list(p.glob('*.glb')))==16
          assert len(list(p.glob('*.obj')))==8
          assert len(list((p/'textures').glob('*.png')))==6
          for name,meta in manifest['assets'].items():
              for lod in (0,1):
                  path=p/f'{name}_lod{lod}.glb'
                  scene=trimesh.load(path,force='scene')
                  assert scene.geometry
                  faces=sum(len(m.faces) for m in scene.geometry.values())
                  assert faces==meta[f'lod{lod}Triangles'],(name,lod,faces,meta)
                  assert all(m.is_winding_consistent for m in scene.geometry.values())
              assert meta['lod1Triangles']<meta['lod0Triangles']
          print('Yomi Rift v11: eight assets, 16 textured GLBs, eight OBJs, six PNGs verified')
          PY
      - name: Commit generated mesh and texture binaries
        run: |
          git config user.name "kagebound-asset-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/world/yomi_rift/v11
          if ! git diff --cached --quiet; then
            git commit -m "assets(world): publish Yomi Rift v11 mesh kit binaries"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
