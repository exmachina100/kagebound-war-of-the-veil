name: Build KAGEBOUND World Mesh Kit
on:
  push:
    branches: [main]
    paths:
      - scripts/generate_world_kit.py
      - .github/workflows/build-world-kit.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: kagebound-world-kit
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install trimesh==4.7.4 numpy==2.3.2
      - name: Generate eight modular GLB and OBJ meshes
        run: python scripts/generate_world_kit.py
      - name: Validate exported files
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import trimesh
          root=Path("assets/world/dojo-moonfall/v01")
          manifest=json.loads((root/"manifest.json").read_text())
          assert manifest["assetCount"] == 8
          for item in manifest["assets"]:
              glb=root/item["glb"]
              obj=root/item["obj"]
              assert glb.stat().st_size>200 and obj.stat().st_size>200
              scene=trimesh.load(glb,force="scene")
              assert len(scene.geometry)>0
              assert item["triangles"]>0
          print("Eight world assets validated at file/mesh level")
          PY
      - name: Commit world mesh kit
        run: |
          git config user.name "kagebound-world-asset-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/world/dojo-moonfall/v01/
          if ! git diff --cached --quiet; then
            git commit -m "assets(world): export Kage Dojo and Moonfall GLB/OBJ kit"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
